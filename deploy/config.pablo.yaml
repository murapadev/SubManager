# SubManager config - Pablo (murapadev)
# Token is injected via GITHUB_TOKEN from /etc/submanager/token.env
github:
  username: "murapadev"
  token: "${GITHUB_TOKEN}"

promotion:
  enabled: true
  days_period: 3
  count_users: 50
  seeds_count: 5
  pages_per_seed: 2
  max_random_page: 5
  affinity_min_score: 2  # prefer people followed by 2+ of your circle

settings:
  retry_on_error: true
  max_concurrent_requests: 5
  request_delay: 0.5
  batch_size: 5
  # ~50 actions per run x 2 runs/day = ~100/day max
  max_follows_per_run: 50
  max_unfollows_per_run: 50
  min_action_delay: 4.0
  max_action_delay: 12.0
  dry_run: false

ban_lists:
  never_unfollow:
    - "torvalds"
  never_follow: []
  ignore_completely: []

logging:
  level: "INFO"
  file: "subscription_manager.log"
